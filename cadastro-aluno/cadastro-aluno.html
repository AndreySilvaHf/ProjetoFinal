<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="cadastro-aluno.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js" defer></script>
    <script type="module" src="cadastro-aluno.js"></script>
</head>
<body>
    <div id="cabecalho"></div>
    <div id="menu"></div>

    <form id="formCadastro">
        <h2>Cadastro de Aluno</h2>

        <div>
            <label for="nomeCompleto">Nome Completo</label>
            <input type="text" id="nomeCompleto" minlength="4" maxlength="80">
        </div>

        <div>
            <label for="genero">Gênero</label>
            <select id="genero">
                <option value="">Selecione</option>
                <option value="feminino">Feminino</option>
                <option value="masculino">Masculino</option>
                <option value="outro">Outro</option>
                <option value="naoInformar">Prefiro não informar</option>
            </select>
        </div>

        <div>
            <label for="dataNascimento">Data de Nascimento</label>
            <input type="text" id="dataNascimento" placeholder="DD/MM/AAAA">
        </div>

        <div>
            <label for="cpf">CPF</label>
            <input type="text" id="cpf">
        </div>

        <div>
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone">
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email">
        </div>

        <h3>Endereço</h3>

        <div>
            <label for="cep">CEP</label>
            <input type="text" id="cep">
        </div>

        <div>
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade">
        </div>

        <div>
            <label for="estado">Estado</label>
            <input type="text" id="estado">
        </div>

        <div>
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro">
        </div>

        <div>
            <label for="numero">Número</label>
            <input type="text" id="numero">
        </div>

        <div>
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento">
        </div>

        <div>
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro">
        </div>

        <span id="mensagem"></span>

        <button type="button" id="btnSalvar">Salvar</button>
    </form>
</body>
</html>
